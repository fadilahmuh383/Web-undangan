<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Tamu Undangan</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-main);
        }
        .dashboard-container {
            background: rgba(25, 25, 25, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            padding: 3.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h2 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, #f9d45e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 2rem;
        }
        .btn-action {
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-print {
            background: linear-gradient(135deg, var(--primary) 0%, #dca820 100%);
            color: #121212;
        }
        .btn-print:hover {
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }
        .btn-delete {
            background: rgba(220,38,38,0.2);
            color: #f87171;
            border: 1px solid #ef4444;
        }
        .btn-delete:hover {
            background: rgba(220,38,38,0.4);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 2.5rem;
        }
        .stat-box {
            background: rgba(0,0,0,0.2);
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-box h3 {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .stat-box p {
            color: var(--text-light);
            font-size: 1.1rem;
            font-weight: 500;
            text-transform: uppercase;
        }
        
        .table-container {
            width: 100%;
            overflow-x: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--white);
        }
        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        th {
            background: rgba(255,255,255,0.05);
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }
        .badge {
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .badge.hadir {
            background: rgba(22, 163, 74, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .badge.tidak-hadir {
            background: rgba(220, 38, 38, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .ucapan-cell {
            min-width: 250px;
            color: rgba(255,255,255,0.85);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.3s;
        }
        .nav-back:hover {
            color: var(--primary);
        }

        /* PRINT STYLES */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0;
            }
            .dashboard-container {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                background: white !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                max-width: 100% !important;
            }
            .header h2 {
                background: none !important;
                color: black !important;
                -webkit-text-fill-color: black !important;
                font-size: 2rem;
            }
            .nav-back, .action-buttons, .stats-grid {
                display: none !important;
            }
            .table-container {
                background: white !important;
                border: 1px solid #ddd !important;
                border-radius: 0 !important;
                overflow: visible !important;
            }
            table {
                color: black !important;
            }
            th {
                background: #f3f4f6 !important;
                color: black !important;
                border-bottom: 2px solid #000 !important;
            }
            th, td {
                border-bottom: 1px solid #ddd !important;
                padding: 12px 10px !important;
                color: black !important;
            }
            .badge.hadir, .badge.tidak-hadir {
                border: 1px solid #000 !important;
                background: transparent !important;
                color: black !important;
            }
            .ucapan-cell {
                color: black !important;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <a href="index.html" class="nav-back"><i class='bx bx-arrow-back'></i> Kembali ke Undangan</a>
        
        <div class="header">
            <h2>Data Kehadiran Tamu</h2>
            <p style="color: var(--text-light)" class="print-hide">Daftar tamu yang telah mengisi form kehadiran</p>
        </div>

        <div class="action-buttons">
            <button onclick="window.print()" class="btn-action btn-print">
                <i class='bx bx-printer'></i> Cetak / Simpan PDF
            </button>
            <button onclick="clearData()" class="btn-action btn-delete">
                <i class='bx bx-trash'></i> Hapus Semua Data
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h3 id="stat-hadir">0</h3>
                <p><i class='bx bx-check-circle'></i> Hadir</p>
            </div>
            <div class="stat-box">
                <h3 id="stat-tidak">0</h3>
                <p><i class='bx bx-x-circle'></i> Tidak Hadir</p>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Nama Tamu</th>
                        <th>Kehadiran</th>
                        <th>Jumlah</th>
                        <th>Ucapan / Doa</th>
                    </tr>
                </thead>
                <tbody id="ucapan-container">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadData() {
            try {
                // Read from LocalStorage
                const rsvpData = JSON.parse(localStorage.getItem('rsvp_data')) || [];
                
                let hadirCount = 0;
                let tidakHadirCount = 0;
                
                const container = document.getElementById('ucapan-container');
                container.innerHTML = '';
                
                // Sort data by newest first
                const sortedData = rsvpData.sort((a, b) => new Date(b.reg_date) - new Date(a.reg_date));

                if (sortedData.length > 0) {
                    sortedData.forEach(item => {
                        const isHadir = item.kehadiran === 'Hadir';
                        
                        // Calculate stats
                        const pax = parseInt(item.jumlah_orang || 1);
                        if (isHadir) {
                            hadirCount += pax;
                        } else {
                            tidakHadirCount++;
                        }
                        
                        const badgeClass = isHadir ? 'badge hadir' : 'badge tidak-hadir';
                        const dateStr = new Date(item.reg_date).toLocaleDateString('id-ID', {
                            day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                        });

                        container.innerHTML += `
                            <tr>
                                <td style="white-space: nowrap; font-size: 0.9rem; color: rgba(255,255,255,0.6);">${dateStr}</td>
                                <td style="font-weight: 600;">${item.nama}</td>
                                <td><span class="${badgeClass}">${item.kehadiran}</span></td>
                                <td>${isHadir ? pax + ' Orang' : '-'}</td>
                                <td class="ucapan-cell">${item.ucapan ? item.ucapan.replace(/\n/g, '<br>') : '-'}</td>
                            </tr>
                        `;
                    });
                } else {
                    container.innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align:center; padding: 40px; color: #999;">
                                <i class='bx bx-message-square-x' style="font-size: 3rem; margin-bottom:10px; color: #ccc;"></i>
                                <p>Belum ada data kehadiran yang masuk.</p>
                            </td>
                        </tr>
                    `;
                }
                
                // Update stats UI
                document.getElementById('stat-hadir').innerText = hadirCount;
                document.getElementById('stat-tidak').innerText = tidakHadirCount;
                
            } catch (err) {
                console.error("Error loading stats:", err);
            }
        }

        function clearData() {
            if(confirm('Yakin ingin menghapus semua data tamu?')) {
                localStorage.removeItem('rsvp_data');
                loadData();
            }
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
