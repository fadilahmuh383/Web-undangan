<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Kehadiran - Noel & Ummi Dila</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px 20px; /* space for top nav */
            flex-direction: column;
            color: var(--text-main);
        }
        .scanner-container {
            background: rgba(25, 25, 25, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            padding: 3rem 2.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h2.title {
            font-family: 'Inter', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, #f9d45e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        p.subtitle {
            color: var(--text-light);
            margin-bottom: 2.5rem;
            font-weight: 400;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        #reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }
        #result-box {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 16px;
            display: none;
            text-align: left;
            backdrop-filter: blur(10px);
        }
        #result-box.success {
            display: block;
            background-color: rgba(22, 163, 74, 0.1);
            border: 1px solid rgba(22, 163, 74, 0.3);
            color: #dcfce7;
        }
        #result-box.error {
            display: block;
            background-color: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #fee2e2;
        }
        .guest-info h4 {
            font-size: 1.4rem;
            color: var(--white);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .guest-info p {
            color: rgba(255,255,255,0.8);
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .btn-reset {
            margin-top: 1.5rem;
            width: 100%;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .admin-menu {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            padding: 5px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .admin-menu a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            font-size: 0.9rem;
            padding: 10px 24px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .admin-menu a:hover {
            color: var(--white);
        }
        .admin-menu a.active {
            color: #121212;
            background: var(--primary);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <!-- Admin Navigation Menu -->
    <nav class="admin-menu">
        <a href="scanner.html" class="active"><i class='bx bx-scan'></i> Scanner</a>
        <a href="dashboard.html"><i class='bx bx-data'></i> Data Kehadiran</a>
    </nav>

    <div class="scanner-container">
        <h2 class="title">Buku Tamu</h2>
        <p class="subtitle">Sistem Scan QR Code Absensi</p>
        
        <div id="reader"></div>
        
        <div id="result-box">
            <div id="result-content" class="guest-info"></div>
            <button id="btn-scan-again" class="btn-primary btn-reset" style="display:none;">Scan Tamu Berikutnya</button>
        </div>
    </div>

    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="scanner.js"></script>
</body>
</html>
